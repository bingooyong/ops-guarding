# debug, release
RunMode = "debug"
# task meta storage dir
MetaDir = "./meta"

[HTTP]
Enable = true
# http listening address
Host = "0.0.0.0"
# http listening port
Port = 2090

[Heartbeat]
# unit: ms
Interval = 1000
# rpc servers
Servers = ["127.0.0.1:20090"]
# $ip or $hostname or specified string
Host = "categraf01"
